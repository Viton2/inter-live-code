# Uso: docker compose up -d     (subir)
#      docker compose down -v   (derrubar e apagar os dados)
# Serve para rodar a aplicacao localmente. Os testes usam Testcontainers e nao dependem disto.
services:
  postgres:
    image: postgres:16-alpine
    container_name: livecode-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka-native:4.3.1
    container_name: livecode-kafka
    # A imagem ja vem com um broker KRaft de no unico, acessivel em localhost:9092
    ports:
      - "9092:9092"
